{
box-sizing: border-box;
margin: 0;
padding: 0;
}
.canvas {
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
background: radial-gradient(circle at 85% 15%, #1e293b 0%, #0a0a0c 55%, #000000 100%);
border-radius: 24px;
padding: 36px 44px;
color: #f5f5f7;
border: 1px solid rgba(255, 255, 255, 0.12);
height: 340px;
display: flex;
flex-direction: column;
justify-content: space-between;
position: relative;
overflow: hidden;
box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
}
.ambient-glow {
position: absolute;
width: 380px;
height: 380px;
background: radial-gradient(circle, rgba(41, 151, 255, 0.14) 0%, rgba(0, 0, 0, 0) 70%);
top: -140px;
right: -80px;
border-radius: 50%;
animation: breathe 7s ease-in-out infinite alternate;
}
@keyframes breathe {
0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
100% { transform: scale(1.2) translate(-25px, 20px); opacity: 1; }
}
.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
z-index: 2;
}
.window-controls {
display: flex;
gap: 8px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.close { background: #ff5f56; }
.minimize { background: #ffbd2e; }
.expand { background: #27c93f; }
.neuron-pill {
display: flex;
align-items: center;
gap: 8px;
background: rgba(255, 255, 255, 0.06);
border: 1px solid rgba(255, 255, 255, 0.12);
padding: 6px 14px;
border-radius: 999px;
font-size: 11px;
font-weight: 600;
letter-spacing: 0.08em;
text-transform: uppercase;
color: #e2e8f0;
}
.status-dot {
width: 7px;
height: 7px;
background: #30d158;
border-radius: 50%;
box-shadow: 0 0 10px #30d158;
animation: blink 2.5s infinite;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.35; }
}
.hero-body {
z-index: 2;
margin-top: 8px;
animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideUp {
from { opacity: 0; transform: translateY(14px); }
to { opacity: 1; transform: translateY(0); }
}
.eyebrow {
font-size: 12px;
font-weight: 600;
letter-spacing: 0.14em;
text-transform: uppercase;
color: #2997ff;
margin-bottom: 8px;
}
.headline {
font-size: 40px;
font-weight: 700;
letter-spacing: -0.03em;
line-height: 1.1;
background: linear-gradient(95deg, #ffffff 0%, #f5f5f7 55%, #86868b 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
margin-bottom: 12px;
}
.subheadline {
font-size: 16px;
font-weight: 400;
color: #86868b;
letter-spacing: -0.01em;
max-width: 620px;
line-height: 1.5;
}
.subheadline b {
color: #f5f5f7;
font-weight: 500;
}
.bento-footer {
display: flex;
justify-content: space-between;
align-items: center;
border-top: 1px solid rgba(255, 255, 255, 0.08);
padding-top: 18px;
z-index: 2;
}
.stack-list {
display: flex;
gap: 10px;
}
.chip {
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.09);
padding: 6px 13px;
border-radius: 10px;
font-size: 12px;
font-weight: 500;
color: #d1d5db;
letter-spacing: -0.01em;
}
.telemetry {
font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
font-size: 11px;
color: #6e6e73;
}

